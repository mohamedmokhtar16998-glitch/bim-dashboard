<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>BIM WOW - Secure Portal</title>
    <!-- استدعاء الخطوط والـ Icons والـ Charts الاحترافية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin crossOrigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #0b0f19; 
            margin: 0;
            padding: 40px 20px;
            color: #e2e8f0; 
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 🎬 جعل الفيديو الخلفي يملأ الشاشة بالكامل */
        .full-screen-video-bg {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: -2;
            object-fit: cover;
            pointer-events: none;
        }

        /* طبقة حماية داكنة على الشاشة بالكامل لتوضيح النصوص */
        .full-screen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(11, 15, 25, 0.75) 0%, rgba(7, 10, 19, 0.93) 100%);
            z-index: -1;
        }

        /* 🏢 الهيدر */
        .user-header {
            max-width: 850px; 
            margin: 0 auto; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 25px; 
            border-radius: 16px 16px 0 0;
            background: rgba(17, 22, 37, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-bottom: none;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .user-info { display: flex; flex-direction: column; }
        .user-name-glow { color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .user-name-glow i { color: #4a72b2; font-size: 16px; filter: drop-shadow(0 0 3px #4a72b2); }
        .glow-line { width: 100%; height: 2px; background: #4a72b2; box-shadow: 0 0 8px #4a72b2; border-radius: 2px; margin-bottom: 10px; }

        .portal-btn {
            background: linear-gradient(135deg, #4a72b2, #294a80);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(74, 114, 178, 0.3);
        }
        .portal-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(74, 114, 178, 0.5);
            background: linear-gradient(135deg, #5782c4, #31548f);
        }

        .company-logo-box { text-align: right; }
        .company-title { font-size: 28px; font-weight: 300; color: #ffffff; margin: 0; letter-spacing: 1px; line-height: 1; }
        .company-title font { font-weight: bold; }
        .company-sub-title { font-size: 10px; color: #8fa0bc; font-weight: 700; letter-spacing: 1.5px; margin: 4px 0 0 0; text-transform: uppercase; }

        /* شريط التنقل */
        .nav-tabs { 
            max-width: 850px; 
            margin: 0 auto; 
            display: flex; 
            background: rgba(17, 22, 37, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 5px 25px; 
            gap: 10px; 
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            box-sizing: border-box;
        }
        .tab-btn {
            background: rgba(24, 31, 50, 0.5); color: #8fa0bc; border: 1px solid rgba(255, 255, 255, 0.05); padding: 8px 18px; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; transition: all 0.25s ease;
        }
        .tab-btn:hover, .tab-btn.active { background: #4a72b2; color: #ffffff; border-color: #4a72b2; box-shadow: 0 0 10px rgba(74, 114, 178, 0.3); }

        /* صندوق مراقبة المتصلين */
        .presence-card-section {
            background: rgba(24, 31, 50, 0.4); border: 1px solid rgba(255,255,255,0.05); padding: 12px 18px; border-radius: 10px; margin-bottom: 25px; display: flex; flex-direction: column; gap: 8px;
        }
        .presence-title { font-size: 11px; font-weight: 700; color: #8fa0bc; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .presence-users-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 2px; }
        .presence-user-pill {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(11, 15, 25, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #cbd5e1;
        }
        .live-pulse-dot {
            width: 7px; height: 7px; background-color: #2ecc71; border-radius: 50%; box-shadow: 0 0 8px #2ecc71; animation: liveDotPulse 1s ease-in-out infinite alternate;
        }
        @keyframes liveDotPulse { from { transform: scale(0.9); opacity: 0.6; } to { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px #2ecc71; } }
        
        .pill-role-admin { color: #2ecc71 !important; border-color: rgba(46, 204, 113, 0.3); text-shadow: 0 0 3px rgba(46, 204, 113, 0.3); }
        .pill-role-manager { color: #f1c40f !important; border-color: rgba(241, 196, 15, 0.3); text-shadow: 0 0 3px rgba(241, 196, 15, 0.3); }
        .pill-role-khaled { color: #3498db !important; border-color: rgba(52, 152, 219, 0.3); text-shadow: 0 0 3px rgba(52, 152, 219, 0.3); }

        /* Container */
        .container { 
            max-width: 850px; background: rgba(17, 22, 37, 0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); margin: 0 auto; padding: 30px; border-radius: 0 0 16px 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.06); border-top: none; box-sizing: border-box;
        }
        
        h1 { text-align: center; color: #ffffff; margin-bottom: 35px; font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
        h1 i { color: #4a72b2; margin-right: 8px; }

        .dashboard-stats-wrapper { display: grid; gap: 15px; margin-bottom: 25px; align-items: stretch; }
        .dashboard-stats-wrapper.stats-admin-layout { grid-template-columns: 1.8fr 1fr 1.5fr; }
        .dashboard-stats-wrapper.stats-khaled-layout { grid-template-columns: 1.8fr 1fr; }

        .analytics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .analytics-card {
            background: rgba(24, 31, 50, 0.45); border: 1px solid rgba(255, 255, 255, 0.05); padding: 12px 8px; border-radius: 10px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: center;
        }
        .analytics-num { font-size: 22px; font-weight: 700; color: #ffffff; font-family: 'Roboto Mono', monospace; display: block; margin-bottom: 2px; }
        .analytics-label { font-size: 10px; color: #8fa0bc; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-glow-all { border-bottom: 3px solid #4a72b2; }
        .card-glow-done { border-bottom: 3px solid #2ecc71; }
        .card-glow-prog { border-bottom: 3px solid #f1c40f; }
        .card-glow-pend { border-bottom: 3px solid #e74c3c; }

        .chart-container-box { 
            background: rgba(24, 31, 50, 0.45); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; height: 160px; width: 100%; max-width: 175px; box-sizing: border-box; overflow: hidden;
        }
        .chart-container-box canvas { max-width: 155px !important; max-height: 155px !important; width: 155px !important; height: 155px !important; z-index: 2; display: block; }

        .activity-log-section { 
            background: rgba(24, 31, 50, 0.45); border: 1px solid rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 10px; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; justify-content: flex-start;
        }
        .activity-log-title { font-size: 10px; font-weight: 700; color: #8fa0bc; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .activity-log-title i { color: #f1c40f; }
        .activity-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; flex: 1; justify-content: flex-start; overflow-y: auto; }
        
        .activity-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #cbd5e1; padding: 5px 8px; background: rgba(11, 15, 25, 0.3); border-radius: 5px; border-left: 2px solid #4a72b2; gap: 6px; line-height: 1.3; }
        .activity-text-wrapper { display: flex; align-items: flex-start; gap: 6px; flex: 1; min-width: 0; }
        .activity-text-wrapper span { white-space: normal; word-break: break-word; font-weight: 500; }
        .activity-time { font-family: 'Roboto Mono', monospace; font-size: 9px; color: #5c6e8c; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
        .delete-log-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 11px; padding: 0 2px; transition: color 0.2s; flex-shrink: 0; display: flex; align-items: center; margin-top: 1px; }
        .delete-log-btn:hover { color: #ff5252; }

        /* كلاس خاص بهيستوري تسجيل الدخول */
        .login-log-item { border-left-color: #3498db; }
        .login-user-tag { color: #3498db; font-weight: 700; }

        .add-task-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .add-task-box input, .add-task-box select, .add-task-box button {
            padding: 12px; border: 1px solid rgba(255, 255, 255, 0.08); background-color: rgba(24, 31, 50, 0.7); color: white; border-radius: 6px; font-size: 13px; outline: none; box-sizing: border-box; width: 100%; font-family: inherit;
        }
        .add-task-box input:focus, .add-task-box select:focus { border-color: #4a72b2; background-color: #1d273b; }
        .add-task-box button { background-color: #4a72b2; border: none; cursor: pointer; font-size: 14px; font-weight: 600; grid-column: span 2; margin-top: 5px; }
        .add-task-box button:hover { background-color: #365991; }

        .filter-section { margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .filter-group { display: flex; flex-wrap: wrap; gap
